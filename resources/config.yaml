server:
  user:
    host: "0.0.0.0"
    grpcPort: "50051"
    name: "user"
    httpPort: "8081"
  medical:
    host: "0.0.0.0"
    grpcPort: "50052"
    name: "medical"
    httpPort: "8082"

database:
  host: mysql
  port: 3306
  user: user
  password: 123456
  database: user
  dialect: mysql
  level: info

redis:
  host: redis
  port: 6379
  password: "123456"
  db: 0
  poolSize: 10
  minIdleConns: 2

sms:
  provider: aliyun
  accessKeyId: "your-access-key-id"
  accessKeySecret: "your-access-key-secret"
  signName: "YourSign"
  templateCode: "SMS_123456789"
  region: "cn-hangzhou"
  codeExpireSeconds: 300

jwt:
  secret: "tokentest"
  expireSeconds: 60480

rocketmq:
  nameServer: "rocketmq-namesrv:9876"
  groupName: "gin-demo-group"
  producerTopic: "user-events"
  consumerTopic: "user-events"
  retryTimes: 3

consul:
  address: "consul:8500"
  healthCheckInterval: "10s"

kafka:
  brokers:
    - "kafka:9092"
  topic: "user-events"
  groupID: "user-consumer-group"